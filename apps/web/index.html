<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weave: write LaTeX and Markdown together in real time, even offline. Free, open source and self-hosted." />
    <meta name="theme-color" content="#2a78d6" />
    <title>Weave · Collaborative LaTeX, even offline</title>
    <script>
      try {
        var t = localStorage.getItem("weave-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
